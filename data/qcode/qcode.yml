markdown: "## Overview\n\nQCode.cc gives developers one API key for Claude, GPT and Chinese models (GLM, Kimi, DeepSeek, Qwen). The request path selects the protocol: Anthropic Messages at `https://api.qcode.cc/api`, OpenAI Chat Completions and Responses at `https://api.qcode.cc/openai/v1`. Claude models are served only on the Anthropic endpoint and GPT models only on the OpenAI endpoint; the Chinese models work on both. Regional hosts are asia.qcode.cc and us.qcode.cc.\n\n## Pricing\n\nPaid. Usage is billed at official model prices (multiplier 1.0). Monthly plans with a daily USD quota start at $9 for 30 days; pay-as-you-go packs start at $4 and are valid for 7 days. No free tier.\n\n## Payment\n\nVisa/Mastercard, Apple Pay, Google Pay, Alipay, WeChat Pay and cryptocurrency; invoices available. CNY and USD pricing.\n\n## Links\n\n- Website: <https://qcode.cc/>\n- Pricing: <https://qcode.cc/pricing>\n- Docs: <https://docs.qcode.cc/en/docs/getting-started/endpoints-and-api-paths>\n"
