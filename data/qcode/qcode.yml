name: "QCode.cc"
description: "QCode.cc is a hosted API service for AI coding tools such as Claude Code and Codex CLI. One API key serves an Anthropic Messages endpoint and an OpenAI-compatible endpoint (Chat Completions and Responses) for Claude, GPT, GLM, Kimi, DeepSeek and Qwen models, billed at official model prices."
